name: correctness
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
      - name: Check sanitizers
        run: make sanitize
      - name: Smoke benchmark
        run: python3 scripts/benchmark.py --preset smoke --trials 1 --output results/local/ci
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/local/ci
